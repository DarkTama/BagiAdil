name: Deploy Bridge to GitHub Pages

# Manual dispatch ONLY (no push trigger): merging to main must NOT replace the
# live GitHub Pages app with the migration bridge until Cloudflare Pages is live
# at https://bagiadil.darktama.dev/. Run this workflow manually once Cloudflare
# Pages is verified and serving the root app.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:bridge

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-bridge

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
