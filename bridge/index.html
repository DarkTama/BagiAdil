<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>BagiAdil telah pindah / BagiAdil has moved</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 460px;
        width: 100%;
        padding: 28px 24px;
        border: 1px solid #262626;
        border-radius: 12px;
        background: #141414;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        color: #d4d4d4;
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        margin-top: 8px;
        color: #60a5fa;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BagiAdil</h1>
      <p>BagiAdil telah pindah ke alamat baru. Mengalihkan secara otomatis...</p>
      <p lang="en">BagiAdil has moved to a new address. Redirecting automatically...</p>
      <a id="target-link" href="https://bagiadil.darktama.dev/">https://bagiadil.darktama.dev/</a>
    </main>
    <script type="module" src="./bridge.js"></script>
  </body>
</html>
