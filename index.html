<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4a90d9" />
    <title>BagiAdil - Split Bills Fairly</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header>
      <h1>BagiAdil</h1>
      <p>Split bills fairly and accurately</p>
    </header>

    <main>
      <div class="mode-tabs">
        <button type="button" class="mode-tab active" data-mode="manual">Manual Entry</button>
        <button type="button" class="mode-tab" data-mode="ocr">Scan Receipt</button>
      </div>

      <div id="ocr-section" class="mode-section" hidden>
        <section id="ocr-upload">
          <h2>Upload Receipt</h2>
          <div class="section-content"></div>
        </section>
        <section id="ocr-results-section" hidden>
          <h2>Scan Results</h2>
          <div class="section-content"></div>
        </section>
      </div>

      <div id="manual-section" class="mode-section">
        <section id="participants">
          <h2>Participants</h2>
          <div class="section-content"></div>
        </section>

        <section id="items">
          <h2>Food Items</h2>
          <div class="section-content"></div>
        </section>

        <section id="bill-params">
          <h2>Discount &amp; Shipping</h2>
          <div class="section-content"></div>
        </section>
      </div>

      <div id="validation-errors"></div>

      <button id="calculate" class="btn btn-primary btn-calculate" type="button">
        Calculate Split
      </button>

      <section id="results">
        <h2>Results</h2>
        <div class="section-content"></div>
      </section>
    </main>

    <footer>
      <p>All calculations happen in your browser. Your data stays private.</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
