<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>BagiAdil - Split Bills Fairly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header>
      <h1>BagiAdil</h1>
      <p>Split bills fairly and accurately</p>
    </header>

    <main>
      <div class="mode-tabs">
        <button type="button" class="mode-tab active" data-mode="manual">Manual Entry</button>
        <button type="button" class="mode-tab" data-mode="ocr">Scan Receipt</button>
      </div>

      <div id="ocr-section" class="mode-section" hidden>
        <section id="ocr-upload">
          <h2>Upload Receipt</h2>
          <div class="section-content"></div>
        </section>
        <section id="ocr-results-section" hidden>
          <h2>Scan Results</h2>
          <div class="section-content"></div>
        </section>
      </div>

      <div id="manual-section" class="mode-section">
        <section id="participants">
          <h2>Participants</h2>
          <div class="section-content"></div>
        </section>

        <section id="items">
          <h2>Food Items</h2>
          <div class="section-content"></div>
        </section>

        <section id="bill-params">
          <h2>Discount &amp; Shipping</h2>
          <div class="section-content"></div>
        </section>
      </div>

      <div id="validation-errors"></div>

      <button id="show-assigner" class="btn btn-primary btn-assigner" type="button">
        Assign Items to Participants
      </button>

      <section id="assigner-section" hidden>
        <h2>Assign Items</h2>
        <div class="section-content"></div>
      </section>

      <button id="calculate" class="btn btn-primary btn-calculate" type="button">
        Calculate Split
      </button>

      <section id="results">
        <h2>Results</h2>
        <div class="section-content"></div>
      </section>

      <section id="export-section" hidden>
        <h2>Export</h2>
        <div class="section-content"></div>
      </section>
    </main>

    <footer>
      <div class="privacy-badge">
        <svg class="privacy-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>Semua perhitungan dilakukan di browser Anda. Tidak ada data yang dikirim ke server manapun.</span>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
