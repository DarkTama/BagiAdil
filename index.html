<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="BagiAdil splits GoFood &amp; ShopeeFood food-delivery bills fairly and automatically - scan the receipt, assign items, and get each person's share with proportional discounts, even shipping split, and rounding to the nearest Rp 100. GrabFood supported too. Runs 100% in your browser."
    />
    <title>BagiAdil - Split GoFood &amp; ShopeeFood Bills Fairly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header>
      <h1>BagiAdil</h1>
      <p data-i18n="header.subtitle">Bagi tagihan secara adil dan akurat</p>
      <div class="lang-toggle">
        <button type="button" class="lang-btn active" data-lang="id">ID</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </header>

    <main>
      <div class="mode-tabs">
        <button type="button" class="mode-tab active" data-mode="manual" data-i18n="tab.manual">Input Manual</button>
        <button type="button" class="mode-tab" data-mode="ocr" data-i18n="tab.scan">Scan Struk</button>
        <button type="button" class="mode-tab" data-mode="history" data-i18n="tab.history">Riwayat</button>
      </div>

      <div id="ocr-section" class="mode-section" hidden>
        <section id="ocr-upload">
          <h2 data-i18n="ocr.scanResults">Hasil Scan</h2>
          <div class="section-content"></div>
        </section>
        <section id="ocr-results-section" hidden>
          <h2 data-i18n="ocr.scanResults">Hasil Scan</h2>
          <div class="section-content"></div>
        </section>
      </div>

      <div id="manual-section" class="mode-section">
        <div class="top-row">
          <section id="participants">
            <h2 data-i18n="section.participants">Peserta</h2>
            <div class="section-content"></div>
          </section>
          <section id="bill-params">
            <h2 data-i18n="section.discountShipping">Diskon &amp; Ongkir</h2>
            <div class="section-content"></div>
          </section>
        </div>

        <section id="add-item-form">
          <h2 data-i18n="table.addItem">Tambah Item</h2>
          <div class="section-content"></div>
        </section>
      </div>

      <section id="history" class="mode-section" hidden>
        <div class="section-content"></div>
      </section>

      <div id="split-workflow">
        <section id="table-assigner">
          <div class="section-content"></div>
        </section>

        <div id="calculate-status"></div>

        <button id="calculate" class="btn btn-primary btn-calculate" type="button" data-i18n="btn.calculate">
          Hitung Pembagian
        </button>

        <div id="validation-errors"></div>

        <section id="results">
          <h2 data-i18n="section.results">Hasil</h2>
          <div class="section-content"></div>
        </section>

        <section id="export-section" hidden>
          <h2 data-i18n="export.title">Ekspor</h2>
          <div class="section-content"></div>
        </section>
      </div>
    </main>

    <footer>
      <div class="privacy-badge">
        <svg class="privacy-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span data-i18n="privacy.text">Semua perhitungan dilakukan di browser Anda. Tidak ada data yang dikirim ke server manapun.</span>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
